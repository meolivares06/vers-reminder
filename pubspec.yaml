name: vers_reminder
description: "Bible verse memorization app with nature wallpapers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  path: ^1.9.0
  wallpaper_manager_flutter: ^1.0.1
  workmanager: ^0.9.0
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.1
  sqflite_common_ffi: ^2.3.0
  shared_preferences_linux: ^2.3.0
  shared_preferences_foundation: ^2.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/seed/verses.json
    - assets/images/nature/
