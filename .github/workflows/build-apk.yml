name: Build and Release APK

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode signing keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > android/app/vers-reminder-release.jks

      - name: Write key.properties
        run: |
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=$GITHUB_WORKSPACE/android/app/vers-reminder-release.jks" >> android/key.properties

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - id: version
        name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep "^version: " pubspec.yaml | cut -d" " -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/vers-reminder-v${{ steps.version.outputs.version }}-arm64.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Build automático del branch master.
            Versión: v${{ steps.version.outputs.version }}
            Arquitectura: arm64-v8a
          files: build/app/outputs/flutter-apk/vers-reminder-v${{ steps.version.outputs.version }}-arm64.apk
          make_latest: true
