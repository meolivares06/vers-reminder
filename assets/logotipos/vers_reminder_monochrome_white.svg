<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  
  

  <!-- RAYOS DE LUZ -->
  <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.35" stroke-width="2.5">
    <line x1="256" y1="340" x2="150" y2="250" />
    <line x1="256" y1="340" x2="175" y2="215" />
    <line x1="256" y1="340" x2="210" y2="190" />
    <line x1="256" y1="340" x2="302" y2="190" />
    <line x1="256" y1="340" x2="337" y2="215" />
    <line x1="256" y1="340" x2="362" y2="250" />
  </g>

  <!-- ESTILOS UNIFICADOS DE TRAZO -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. CELULAR / WALLPAPER FRAME -->
    <rect x="150" y="60" width="212" height="320" rx="32" stroke-width="10" />

    <!-- 2. ESPADA -->
    <!-- Pomo de la espada -->
    <circle cx="256" cy="98" r="12" stroke-width="8" />

    <!-- Empuñadura / Mango -->
    <path d="M 256 110 L 256 155" stroke-width="10" />

    <!-- GUARDA / CRUCETA HORIZONTAL (Usando rect/path para evitar bug de bounds en gradientes) -->
    <rect x="160" y="152" width="192" height="14" rx="7" fill="#FFFFFF" stroke="none" />
    <!-- Remates verticales en los extremos de la guarda -->
    <rect x="160" y="143" width="8" height="32" rx="4" fill="#FFFFFF" stroke="none" />
    <rect x="344" y="143" width="8" height="32" rx="4" fill="#FFFFFF" stroke="none" />

    <!-- Hoja de la espada -->
    <path d="M 226 166 L 226 280 L 256 345 L 286 280 L 286 166" stroke-width="9" />
    <!-- Línea central de la hoja -->
    <path d="M 256 166 L 256 325" stroke-width="5" />

    <!-- 3. BIBLIA ABIERTA (BASE) -->
    <!-- Páginas superiores -->
    <path d="M 100 340 Q 178 295 256 350 Q 334 295 412 340" stroke-width="10" />
    <!-- Páginas intermedias -->
    <path d="M 80 365 Q 168 320 256 375 Q 344 320 432 365" stroke-width="10" />
    <!-- Páginas inferiores -->
    <path d="M 60 390 Q 158 345 256 400 Q 354 345 452 390" stroke-width="10" />
    <!-- Lomo central -->
    <path d="M 256 350 L 256 400" stroke-width="8" />

  </g>
</svg>