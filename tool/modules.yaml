modules:
  wallpaper:
    path: lib/wallpaper
    deps: [shared, scheduler, backup, notifications, verses]
    barrel: lib/wallpaper/wallpaper.dart
    files:
      - domain/wallpaper_status.dart
      - domain/wallpaper_result.dart
      - application/wallpaper_state.dart
      - infrastructure/wallpaper_generator.dart
      - infrastructure/image_cache_service.dart
      - infrastructure/temp_cleanup_service.dart
    exceptions:
      - "scheduler → wallpaper/wallpaper_generator.dart (isolate)"

  scheduler:
    path: lib/scheduler
    deps: [shared, wallpaper]
    barrel: lib/scheduler/scheduler.dart
    files:
      - application/scheduler_config.dart
      - infrastructure/wallpaper_scheduler.dart

  verses:
    path: lib/verses
    deps: [shared]
    barrel: lib/verses/verses.dart
    files:
      - domain/verse.dart
      - application/verse_provider.dart
      - application/seed_loader.dart
      - widgets/category_create_dialog.dart
      - widgets/verse_form_screen.dart
      - widgets/verse_list_screen.dart

  home:
    path: lib/home
    deps: [shared, wallpaper, settings, verses]
    barrel: lib/home/home.dart
    files:
      - application/home_container.dart
      - widgets/wallpaper_card.dart
      - widgets/empty_home.dart

  settings:
    path: lib/settings
    deps: [shared, wallpaper, backup, verses]
    barrel: lib/settings/settings.dart
    files:
      - application/appearance_settings.dart
      - infrastructure/settings_screen.dart
      - infrastructure/about_screen.dart
      - infrastructure/update_check_result.dart
      - infrastructure/update_cleanup_service.dart
      - infrastructure/update_service.dart

  backup:
    path: lib/backup
    deps: [shared]
    barrel: lib/backup/backup.dart
    files:
      - infrastructure/wallpaper_backup_service.dart

  notifications:
    path: lib/notifications
    deps: [shared]
    barrel: lib/notifications/notifications.dart
    files:
      - infrastructure/notification_service.dart

  shared:
    path: lib/shared
    deps: []
    barrel: lib/shared/shared.dart
    files:
      - domain/database_service.dart
      - domain/category.dart
      - application/locale_provider.dart
      - application/sweep_utils.dart
      - theme/app_theme.dart
      - widgets/app_version.dart
      - widgets/async_action_button.dart
      - widgets/confirm_delete_dialog.dart
      - widgets/section_header.dart
      - widgets/verse_tile.dart
      - l10n/generated/app_localizations.dart
      - l10n/generated/app_localizations_en.dart
      - l10n/generated/app_localizations_es.dart
      - l10n/generated/app_localizations_pt.dart
      - event_bus/event_bus.dart
      - event_bus/events.dart

events:
  RefreshWallpaper:
    emitters: [home]
    receivers: [wallpaper/application/wallpaper_state]
    replaces: home→wallpaper triggerNow
  WallpaperGenerated:
    emitters: [wallpaper/application/wallpaper_state]
    receivers: [home]
    replaces: home→wallpaper WallpaperStatus polling
  SettingChanged:
    emitters: [wallpaper/application/wallpaper_state]
    receivers: [home]
    replaces: home→settings wallpaper status polling
  SchedulerToggled:
    emitters: [scheduler/application/scheduler_config]
    receivers: [scheduler]
    replaces: SchedulerConfig→WallpaperScheduler direct calls
  NotificationRequested:
    emitters: [wallpaper/application/wallpaper_state, scheduler/application/scheduler_config]
    receivers: [notifications]
    replaces: WallpaperState/SchedulerConfig→NotificationService direct calls
  PermissionGranted:
    emitters: [settings]
    receivers: []
    replaces: cross-module permission state query
  BackupRestored:
    emitters: [backup]
    receivers: []
    replaces: backup→home direct notification
  VerseAdded:
    emitters: [verses]
    receivers: [home, settings]
    replaces: verses→home/settings direct reload calls
