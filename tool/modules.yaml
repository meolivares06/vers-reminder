modules:
  wallpaper:
    path: lib/wallpaper
    deps: [shared, scheduler, backup, notifications, verses]
    barrel: lib/wallpaper/wallpaper.dart
    files:
      - wallpaper_generator.dart
      - image_cache_service.dart
      - temp_cleanup_service.dart
      - domain/wallpaper_status.dart
      - domain/wallpaper_result.dart
    exceptions:
      - "scheduler → wallpaper/wallpaper_generator.dart (isolate)"

  scheduler:
    path: lib/scheduler
    deps: [shared, wallpaper]
    barrel: lib/scheduler/scheduler.dart
    files:
      - wallpaper_scheduler.dart

  verses:
    path: lib/verses
    deps: [shared]
    barrel: lib/verses/verses.dart
    files:
      - verse_provider.dart
      - seed_loader.dart
      - domain/verse.dart
      - category_create_dialog.dart
      - verse_form_screen.dart
      - verse_list_screen.dart

  home:
    path: lib/home
    deps: [shared, wallpaper, settings, verses]
    barrel: lib/home/home.dart
    files:
      - home_screen.dart

  settings:
    path: lib/settings
    deps: [shared, wallpaper, backup, verses]
    barrel: lib/settings/settings.dart
    files:
      - settings_screen.dart
      - about_screen.dart
      - update_check_result.dart
      - update_cleanup_service.dart
      - update_service.dart

  backup:
    path: lib/backup
    deps: [shared]
    barrel: lib/backup/backup.dart
    files:
      - wallpaper_backup_service.dart

  notifications:
    path: lib/notifications
    deps: [shared]
    barrel: lib/notifications/notifications.dart
    files:
      - notification_service.dart

  shared:
    path: lib/shared
    deps: []
    barrel: lib/shared/shared.dart
    files:
      - database_service.dart
      - settings_provider.dart
      - locale_provider.dart
      - sweep_utils.dart
      - category.dart
      - theme/app_theme.dart
      - widgets/app_version.dart
      - widgets/async_action_button.dart
      - widgets/confirm_delete_dialog.dart
      - widgets/section_header.dart
      - widgets/verse_tile.dart
      - l10n/generated/app_localizations.dart
      - l10n/generated/app_localizations_en.dart
      - l10n/generated/app_localizations_es.dart
      - l10n/generated/app_localizations_pt.dart
      - event_bus/event_bus.dart
      - event_bus/events.dart

events:
  RefreshWallpaper:
    emitters: [home, settings]
    receivers: [shared/settings_provider]
    replaces: home→wallpaper triggerNow, settings→wallpaper triggerNow
  WallpaperGenerated:
    emitters: [shared/settings_provider]
    receivers: [home]
    replaces: home→wallpaper WallpaperStatus polling
  SettingChanged:
    emitters: [shared/settings_provider]
    receivers: [home]
    replaces: home→settings wallpaper status polling
  SchedulerToggled:
    emitters: [shared/settings_provider]
    receivers: [scheduler]
    replaces: settings_provider→WallpaperScheduler direct calls
  NotificationRequested:
    emitters: [shared/settings_provider]
    receivers: [notifications]
    replaces: settings_provider→NotificationService direct calls
  PermissionGranted:
    emitters: [settings]
    receivers: []
    replaces: cross-module permission state query
  BackupRestored:
    emitters: [backup]
    receivers: []
    replaces: backup→home direct notification
  VerseAdded:
    emitters: [verses]
    receivers: [home, settings]
    replaces: verses→home/settings direct reload calls
